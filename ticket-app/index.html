<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tickets</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-guardar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-guardar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-generar {
            background: #27ae60;
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-generar:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        .btn-generar:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-eliminar {
            background: #e74c3c;
            color: white;
            padding: 8px 12px;
            font-size: 12px;
        }

        .btn-eliminar:hover {
            background: #c0392b;
        }

        .registros-section {
            margin-top: 40px;
        }

        .registros-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .tabla-registros {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .tabla-registros thead {
            background: #f8f9fa;
        }

        .tabla-registros th {
            padding: 12px;
            text-align: left;
            color: #333;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }

        .tabla-registros td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            color: #555;
        }

        .tabla-registros tbody tr:hover {
            background: #f8f9fa;
        }

        .tabla-registros .acciones {
            text-align: center;
        }

        .vacio {
            text-align: center;
            color: #999;
            padding: 30px;
            font-style: italic;
        }

        /* Estilos para impresión */
        #ticket {
            display: none;
        }

        @media print {
            @page {
                size: 62mm 29mm;
                margin: 0;
            }

            body {
                background: white;
                padding: 0;
                width: 62mm;
                height: 29mm;
            }

            .container {
                display: none;
            }

            #ticket {
                display: block !important;
                width: 62mm;
                height: 29mm;
                overflow: hidden;
            }

            .ticket-container {
                width: 62mm;
                height: 29mm;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 2mm;
                padding: 1.5mm;
                border: 0;
                page-break-inside: avoid;
            }

            .ticket-header {
                flex: 1;
                min-width: 0;
                text-align: left;
                margin: 0;
                border: 0;
                padding: 0;
            }

            .ticket-title {
                font-size: 8px;
                font-weight: bold;
                margin-bottom: 1mm;
            }

            .ticket-fecha {
                font-size: 6px;
                color: #666;
            }

            .ticket-contenido {
                display: none;
            }

            .ticket-qr {
                flex: 0 0 24mm;
                width: 24mm;
                height: 24mm;
                margin: 0;
                border: 0;
                padding: 0;
                text-align: center;
            }

            .ticket-qr canvas,
            .ticket-qr img {
                display: block;
                width: 24mm !important;
                height: 24mm !important;
                max-width: 24mm;
            }

            .qr-label {
                display: none;
            }
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #c3e6cb;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Gestor de Tickets</h1>
            <p>Crea, gestiona e imprime tus registros</p>
        </div>

        <div class="content">
            <div class="success-message" id="successMessage">
                ✓ Registro guardado correctamente
            </div>

            <!-- Formulario -->
            <form id="formulario">
                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        placeholder="Ej: ryan gosling" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción *</label>
                    <textarea 
                        id="descripcion" 
                        placeholder="Ej: Solicitud de cambio en el sistema..." 
                        required
                    ></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-guardar">💾 Guardar</button>
                    <button 
                        type="button" 
                        class="btn-generar" 
                        id="generarBtn"
                        onclick="generarTicket()"
                    >
                        🖨️ Generar Ticket
                    </button>
                </div>
            </form>

            <!-- Registros -->
            <div class="registros-section">
                <h2>📝 Registros Guardados</h2>
                <div id="registrosContainer">
                    <div class="vacio">No hay registros aún. ¡Crea uno nuevo!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Área de impresión (oculta) -->
    <div id="ticket"></div>

    <script>
        const STORAGE_KEY = 'tickets_data';

        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            cargarRegistros();
        });

        // Guardar nuevo registro
        document.getElementById('formulario').addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();

            if (!nombre || !descripcion) {
                alert('Por favor completa todos los campos');
                return;
            }

            // Crear objeto de registro
            const registro = {
                id: Date.now(),
                nombre: nombre,
                descripcion: descripcion,
                fecha: new Date().toLocaleString('es-ES')
            };

            // Obtener datos existentes
            let datos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            // Agregar nuevo registro
            datos.push(registro);

            // Guardar en localStorage
            localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));

            // Mostrar mensaje de éxito
            const mensaje = document.getElementById('successMessage');
            mensaje.classList.add('show');
            setTimeout(() => {
                mensaje.classList.remove('show');
            }, 3000);

            // Limpiar formulario
            this.reset();
            document.getElementById('nombre').focus();

            // Actualizar lista
            cargarRegistros();
        });

        // Cargar y mostrar registros
        function cargarRegistros() {
            const datos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const container = document.getElementById('registrosContainer');

            if (datos.length === 0) {
                container.innerHTML = '<div class="vacio">No hay registros aún. ¡Crea uno nuevo!</div>';
                document.getElementById('generarBtn').disabled = true;
                return;
            }

            document.getElementById('generarBtn').disabled = false;

            let html = `
                <table class="tabla-registros">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Fecha/Hora</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            datos.forEach(registro => {
                html += `
                    <tr>
                        <td><strong>${escaparHTML(registro.nombre)}</strong></td>
                        <td>${escaparHTML(registro.descripcion)}</td>
                        <td>${registro.fecha}</td>
                        <td class="acciones">
                            <button 
                                class="btn-eliminar" 
                                onclick="eliminarRegistro(${registro.id})"
                            >
                                🗑️ Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // Eliminar registro
        function eliminarRegistro(id) {
            if (confirm('¿Estás seguro de que deseas eliminar este registro?')) {
                let datos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                datos = datos.filter(r => r.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
                cargarRegistros();
            }
        }

        // Generar ticket imprimible con QR
        function generarTicket() {
            const datos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            if (datos.length === 0) {
                alert('No hay registros para generar el ticket');
                return;
            }

            // Crear contenido del ticket
            let html = '<div class="ticket-container">';
            html += '<div class="ticket-header">';
            html += '<div class="ticket-title">TICKET DE REGISTROS</div>';
            html += `<div class="ticket-fecha">Generado: ${new Date().toLocaleString('es-ES')}</div>`;
            html += '</div>';

            html += '<div class="ticket-contenido">';
            datos.forEach((registro, index) => {
                html += '<div class="ticket-item">';
                html += `<div class="ticket-nombre">${index + 1}. ${escaparHTML(registro.nombre)}</div>`;
                html += `<div class="ticket-descripcion">${escaparHTML(registro.descripcion)}</div>`;
                html += `<div class="ticket-hora">${registro.fecha}</div>`;
                html += '</div>';
            });
            html += '</div>';

            // Crear QR con los datos
            const datosJSON = JSON.stringify(datos);
            const qrContainerId = 'qrcode-container-' + Date.now();
            
            html += `<div class="ticket-qr">`;
            html += `<div id="${qrContainerId}"></div>`;
            html += `<div class="qr-label">Escanea para ver los datos</div>`;
            html += `</div>`;
            html += '</div>';

            document.getElementById('ticket').innerHTML = html;

            // Generar QR después de que se haya insertado el HTML
            setTimeout(() => {
                new QRCode(document.getElementById(qrContainerId), {
                    text: datosJSON,
                    width: 200,
                    height: 200,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });

                // Imprimir
                window.print();
            }, 100);
        }

        // Función auxiliar para escapar caracteres HTML
        function escaparHTML(texto) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return texto.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
